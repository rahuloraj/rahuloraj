name: Rahul Raj GOD MODE Breakout

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GOD MODE SVG
        run: |
          mkdir -p dist
          cat << 'EOF' > dist/breakout.svg
          <svg width="1000" height="380" xmlns="http://www.w3.org/2000/svg">

            <!-- DEFINITIONS -->
            <defs>
              <filter id="glow">
                <feGaussianBlur stdDeviation="4"/>
                <feMerge>
                  <feMergeNode/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#08f7fe"/>
                <stop offset="50%" stop-color="#ff2e63"/>
                <stop offset="100%" stop-color="#8a2be2"/>
              </linearGradient>
            </defs>

            <!-- BACKGROUND -->
            <rect width="100%" height="100%" fill="#0d1117"/>

            <!-- SCORE BOARD -->
            <text x="20" y="30" fill="#39d353" font-size="18">
              SCORE: 
              <tspan>
                <animate attributeName="textContent"
                  values="0;120;240;360;480;600;720;999"
                  dur="4s"
                  repeatCount="indefinite"/>
              </tspan>
            </text>

            <!-- GRID BLOCKS -->
            <g>
              $(for i in {0..49}; do
                for j in {0..6}; do
                  x=$((i*18+30))
                  y=$((j*18+40))

                  echo "<rect x='$x' y='$y' width='12' height='12' rx='3' fill='url(#neon)' opacity='0.25'/>"
                done
              done)
            </g>

            <!-- BREAK EFFECT BLOCK -->
            <rect x="300" y="100" width="12" height="12" fill="#39d353">
              <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
            </rect>

            <!-- PADDLE -->
            <rect y="320" width="140" height="12" rx="6" fill="#58a6ff" filter="url(#glow)">
              <animate attributeName="x" values="50;800;50" dur="2.5s" repeatCount="indefinite"/>
            </rect>

            <!-- BALL -->
            <circle r="9" fill="#f85149" filter="url(#glow)">
              <animateMotion dur="2.5s" repeatCount="indefinite"
                path="M500 280 L120 60 L900 200 L400 80 L700 250 Z"/>
            </circle>

            <!-- TITLE -->
            <text x="50%" y="365" fill="#ffffff" font-size="16" text-anchor="middle">
              🚀 Rahul Raj • GOD MODE Breakout Engine
            </text>

          </svg>
          EOF

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
